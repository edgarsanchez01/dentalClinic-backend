# Configuracion comun de DentalClinic.
#
# CONVENCION OFICIAL: DentalClinic configura Spring Boot exclusivamente con
# archivos `application*.properties`. No existen variantes YAML equivalentes
# (Architecture.md 5.6).
#
# El perfil por defecto se comporta como produccion (Architecture.md 12.2 y 13.1):
# no toca el esquema y no crea datos. Cualquier override viene de un archivo de
# perfil explicito (dev / test / prod) o de variables de entorno.
#
# No hay secretos en el repositorio (Architecture.md 19.2, Agents.md 5.4).

spring.application.name=dentalclinic-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dentalclinic}
spring.datasource.username=${DB_USERNAME:dentalclinic}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.pool-name=dentalclinic-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# Ninguna vista se resuelve fuera de la capa de aplicacion (Architecture.md 8, 5.1).
spring.jpa.open-in-view=false
# Por defecto NUNCA se altera el esquema (Architecture.md 12.4).
# Flyway y Liquibase estan prohibidos (Architecture.md 12.1, Agents.md Regla 10).
spring.jpa.hibernate.ddl-auto=none
# Los instantes son absolutos y se guardan en timestamptz (Architecture.md 12.8).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Sensitive intake data must never reach SQL/parameter or PostgreSQL error logging.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.jdbc.core=OFF

spring.jackson.default-property-inclusion=non_null

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
# D4 usa el peer TCP real y resuelve XFF únicamente con su allowlist explícita de proxies.
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false
# Nunca publicar valores de configuración/secretos mediante Actuator.
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never

info.app.name=DentalClinic
info.app.phase=3-clinica-onboarding

# Guardas de fixtures: desactivadas por defecto y sin ninguna accion asociada.
# En Fase 1 no existe seeder; estas propiedades solo hacen posible que las
# barreras sean configurables y auditables (Architecture.md 13.3).
dentalclinic.fixtures.enabled=false
dentalclinic.fixtures.require-empty-database=true
dentalclinic.fixtures.allowed-profiles=dev,demo
dentalclinic.fixtures.forbidden-databases=dental,postgres,production,prod

# =============================================================================
# Seguridad de Fase 2 (Architecture.md 7, PRD 24.4). El perfil por defecto se
# comporta como produccion (Architecture.md 12.2): todo lo que dependa del
# entorno MUESTRA un placeholder vacio y el arranque falla de forma clara si no
# se provee. Solo dev y test (o el operador en produccion) fijan los valores.
# =============================================================================

# Clave simetrica de firma HS256 del access token (jjwt). Minimo 32 caracteres.
# Es un secreto real: jamas se escribe en el repositorio.
dentalclinic.security.jwt.secret=${JWT_SECRET:}
dentalclinic.security.jwt.issuer=dentalclinic
# Normativo (P-01 CLOSED, Architecture.md 7.1): access token de 15 minutos.
dentalclinic.security.jwt.access-token-ttl=15m
# Normativo (P-02 CLOSED, Architecture.md 7.1): refresh de 30 dias, deslizante.
dentalclinic.security.refresh.ttl=30d
# Caducidad de tokens de un solo uso (RF-IA-09 invitacion, RF-IA-12 recuperacion).
# SIN DEFAULT DE PRODUCCION: la decision de producto no existe; si el entorno no
# las define, el arranque falla en vez de asumir 72 h, 1 h o los 30 dias del
# refresh. Dev y test fijan valores exclusivamente tecnicos en sus perfiles.
dentalclinic.security.invitation.ttl=${INVITATION_TTL:}
dentalclinic.security.password-reset.ttl=${PASSWORD_RESET_TTL:}
# Cookie del refresh token. Atributos normativos (P-01, Architecture.md 7.1);
# Secure=true en produccion, se desactiva solo en dev/test por el HTTP sin TLS.
dentalclinic.security.refresh-cookie.name=dentalclinic_refresh
dentalclinic.security.refresh-cookie.secure=true
dentalclinic.security.refresh-cookie.same-site=Lax
dentalclinic.security.refresh-cookie.path=/api/auth
# CORS con origenes explicitos (Architecture.md 7.9): nunca '*' en produccion.
dentalclinic.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# =============================================================================
# Comunicaciones (F8/T1, Architecture.md 9, PRD 14/34.12-13).
#
# El dispatcher solo DESPACHA si el operador lo habilita y solo ENVIA si existe
# un adaptador SMTP (COMMUNICATION_EMAIL_ENABLED=true + SPRING_MAIL_HOST). Sin
# SMTP explicito no se envía ningun correo real y ninguna comunicacion se marca
# SENT: los mensajes permanecen PENDING. Las credenciales SMTP llegan siempre
# por entorno (SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD), nunca en el repo.
# =============================================================================

# ---- Adaptador SMTP (puerto EmailSender) ----
dentalclinic.communication.email.enabled=${COMMUNICATION_EMAIL_ENABLED:false}
dentalclinic.communication.email.from=${COMMUNICATION_EMAIL_FROM:}

# ---- Bucle de despacho (job programado) ----
# interval / initial-delay son duraciones (p. ej. 60s, 1m, PT1M) usadas por el
# SchedulingConfigurer; son configuracion tecnica, no de producto.
dentalclinic.communication.dispatch.enabled=${COMMUNICATION_DISPATCH_ENABLED:false}
dentalclinic.communication.dispatch.interval=${COMMUNICATION_DISPATCH_INTERVAL:60s}
dentalclinic.communication.dispatch.initial-delay=${COMMUNICATION_DISPATCH_INITIAL_DELAY:30s}

# ---- Retransmision y claim (PRD 14.5 / Architecture 9.4) ----
# Maximo de intentos y backoff exponencial con tope.
dentalclinic.communication.dispatch.batch-size=${COMMUNICATION_DISPATCH_BATCH_SIZE:20}
dentalclinic.communication.dispatch.max-attempts=${COMMUNICATION_DISPATCH_MAX_ATTEMPTS:4}
dentalclinic.communication.dispatch.initial-backoff=${COMMUNICATION_DISPATCH_INITIAL_BACKOFF:1m}
dentalclinic.communication.dispatch.backoff-multiplier=${COMMUNICATION_DISPATCH_BACKOFF_MULTIPLIER:5}
dentalclinic.communication.dispatch.max-backoff=${COMMUNICATION_DISPATCH_MAX_BACKOFF:1h}
dentalclinic.communication.dispatch.lease=${COMMUNICATION_DISPATCH_LEASE:5m}

# ---- Productor de recordatorios (T4.1): independiente de SMTP y del dispatcher ----
# Activación operativa explícita; nunca genera datos en dev/test por un arranque accidental.
dentalclinic.appointment.reminder.enabled=${APPOINTMENT_REMINDER_ENABLED:false}
dentalclinic.appointment.reminder.interval=${APPOINTMENT_REMINDER_INTERVAL:60s}
dentalclinic.appointment.reminder.initial-delay=${APPOINTMENT_REMINDER_INITIAL_DELAY:30s}
dentalclinic.appointment.reminder.batch-size=${APPOINTMENT_REMINDER_BATCH_SIZE:50}
dentalclinic.appointment.reminder.max-batches=${APPOINTMENT_REMINDER_MAX_BATCHES:10}
# Entrega operativa opt-in (default false). T4.2 comprueba vigencia/anulación antes de SMTP.
dentalclinic.appointment.reminder.email-delivery-enabled=${APPOINTMENT_REMINDER_EMAIL_DELIVERY_ENABLED:false}

# Feedback 5C: URL del frontend confiable. Sin URL configurada no se prepara el correo.
dentalclinic.feedback.public-base-url=${FEEDBACK_PUBLIC_BASE_URL:}
# HMAC separado por dominio. Se recomienda una clave dedicada estable; nunca persistirla en BD.
dentalclinic.feedback.token-secret=${FEEDBACK_TOKEN_SECRET:${dentalclinic.security.jwt.secret}}

# =============================================================================
# Enlaces de identidad (F8B/T1, Architecture.md 9 y H-A02/21).
#
# Recompone el enlace de invitación/recuperación en el momento del envío a partir
# de datos inmutables + un nonce por emisión, sin persistir jamás el token ni la
# URL (patrón de 9.7). Con links-enabled=false se permiten URL/clave vacías;
# los valores presentes sí se validan. No se habilita el transporte por defecto.
#
# La clave HMAC es DEDICADA y NO hereda de JWT_SECRET: dominios criptográficos
# separados. Al habilitar links-enabled=true, la URL y la clave de al menos 32
# caracteres son obligatorias (el arranque falla si faltan). La URL debe ser
# HTTPS (HTTP solo localhost/127.0.0.1). No habilita ningun canal de correo.
# =============================================================================
dentalclinic.identity.public-base-url=${IDENTITY_PUBLIC_BASE_URL:}
dentalclinic.identity.link-secret=${IDENTITY_LINK_SECRET:}
dentalclinic.identity.links-enabled=${IDENTITY_LINKS_ENABLED:false}

# =============================================================================
# Outbox de enlaces de identidad (F8B.2, Architecture.md 9 y D2).
#
# Transporte durable de los enlaces de invitación/recuperación, DESACOPLADO de la
# outbox de citas (communication). Reutiliza el puerto EmailSender, pero solo
# despacha si el operador habilita el job Y los enlaces estan configurados Y existe
# un adaptador SMTP: sin nada de eso las entregas quedan PENDING y NO se consume
# ningun intento. El job esta apagado por defecto (no se registra ninguna tarea).
# Los valores de batch/backoff/lease son tecnicos, no de producto.
# =============================================================================
dentalclinic.identity.email.dispatch-enabled=${IDENTITY_EMAIL_DISPATCH_ENABLED:false}
dentalclinic.identity.email.interval=${IDENTITY_EMAIL_DISPATCH_INTERVAL:60s}
dentalclinic.identity.email.initial-delay=${IDENTITY_EMAIL_DISPATCH_INITIAL_DELAY:30s}
dentalclinic.identity.email.batch-size=${IDENTITY_EMAIL_DISPATCH_BATCH_SIZE:20}
dentalclinic.identity.email.max-attempts=${IDENTITY_EMAIL_DISPATCH_MAX_ATTEMPTS:4}
dentalclinic.identity.email.initial-backoff=${IDENTITY_EMAIL_DISPATCH_INITIAL_BACKOFF:1m}
dentalclinic.identity.email.backoff-multiplier=${IDENTITY_EMAIL_DISPATCH_BACKOFF_MULTIPLIER:5}
dentalclinic.identity.email.max-backoff=${IDENTITY_EMAIL_DISPATCH_MAX_BACKOFF:1h}
dentalclinic.identity.email.lease=${IDENTITY_EMAIL_DISPATCH_LEASE:5m}

# D4: emisiones por cuenta (durables con outbox) e intentos por IP (locales/acotados).
dentalclinic.identity.abuse.reset-cooldown=${IDENTITY_RESET_COOLDOWN:1m}
dentalclinic.identity.abuse.reset-window=${IDENTITY_RESET_WINDOW:1h}
dentalclinic.identity.abuse.reset-max-per-account=${IDENTITY_RESET_MAX_PER_ACCOUNT:3}
dentalclinic.identity.abuse.staff-cooldown=${IDENTITY_STAFF_COOLDOWN:1m}
dentalclinic.identity.abuse.staff-window=${IDENTITY_STAFF_WINDOW:1h}
dentalclinic.identity.abuse.staff-max-per-account=${IDENTITY_STAFF_MAX_PER_ACCOUNT:5}
dentalclinic.identity.abuse.ip-window=${IDENTITY_IP_WINDOW:15m}
dentalclinic.identity.abuse.reset-max-per-ip=${IDENTITY_RESET_MAX_PER_IP:20}
dentalclinic.identity.abuse.staff-max-per-ip=${IDENTITY_STAFF_MAX_PER_IP:30}
dentalclinic.identity.abuse.max-ip-entries=${IDENTITY_IP_MAX_ENTRIES:10000}
dentalclinic.identity.abuse.trusted-proxies=${IDENTITY_TRUSTED_PROXIES:}
