# Configuracion comun de DentalClinic.
#
# CONVENCION OFICIAL: DentalClinic configura Spring Boot exclusivamente con
# archivos `application*.properties`. No existen variantes YAML equivalentes
# (Architecture.md 5.6).
#
# El perfil por defecto se comporta como produccion (Architecture.md 12.2 y 13.1):
# no toca el esquema y no crea datos. Cualquier override viene de un archivo de
# perfil explicito (dev / test / prod) o de variables de entorno.
#
# No hay secretos en el repositorio (Architecture.md 19.2, Agents.md 5.4).

spring.application.name=dentalclinic-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dentalclinic}
spring.datasource.username=${DB_USERNAME:dentalclinic}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.pool-name=dentalclinic-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

# Ninguna vista se resuelve fuera de la capa de aplicacion (Architecture.md 8, 5.1).
spring.jpa.open-in-view=false
# Por defecto NUNCA se altera el esquema (Architecture.md 12.4).
# Flyway y Liquibase estan prohibidos (Architecture.md 12.1, Agents.md Regla 10).
spring.jpa.hibernate.ddl-auto=none
# Los instantes son absolutos y se guardan en timestamptz (Architecture.md 12.8).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

info.app.name=DentalClinic
info.app.phase=3-clinica-onboarding

# Guardas de fixtures: desactivadas por defecto y sin ninguna accion asociada.
# En Fase 1 no existe seeder; estas propiedades solo hacen posible que las
# barreras sean configurables y auditables (Architecture.md 13.3).
dentalclinic.fixtures.enabled=false
dentalclinic.fixtures.require-empty-database=true
dentalclinic.fixtures.allowed-profiles=dev,demo
dentalclinic.fixtures.forbidden-databases=dental,postgres,production,prod

# =============================================================================
# Seguridad de Fase 2 (Architecture.md 7, PRD 24.4). El perfil por defecto se
# comporta como produccion (Architecture.md 12.2): todo lo que dependa del
# entorno MUESTRA un placeholder vacio y el arranque falla de forma clara si no
# se provee. Solo dev y test (o el operador en produccion) fijan los valores.
# =============================================================================

# Clave simetrica de firma HS256 del access token (jjwt). Minimo 32 caracteres.
# Es un secreto real: jamas se escribe en el repositorio.
dentalclinic.security.jwt.secret=${JWT_SECRET:}
dentalclinic.security.jwt.issuer=dentalclinic
# Normativo (P-01 CLOSED, Architecture.md 7.1): access token de 15 minutos.
dentalclinic.security.jwt.access-token-ttl=15m
# Normativo (P-02 CLOSED, Architecture.md 7.1): refresh de 30 dias, deslizante.
dentalclinic.security.refresh.ttl=30d
# Caducidad de tokens de un solo uso (RF-IA-09 invitacion, RF-IA-12 recuperacion).
# SIN DEFAULT DE PRODUCCION: la decision de producto no existe; si el entorno no
# las define, el arranque falla en vez de asumir 72 h, 1 h o los 30 dias del
# refresh. Dev y test fijan valores exclusivamente tecnicos en sus perfiles.
dentalclinic.security.invitation.ttl=${INVITATION_TTL:}
dentalclinic.security.password-reset.ttl=${PASSWORD_RESET_TTL:}
# Cookie del refresh token. Atributos normativos (P-01, Architecture.md 7.1);
# Secure=true en produccion, se desactiva solo en dev/test por el HTTP sin TLS.
dentalclinic.security.refresh-cookie.name=dentalclinic_refresh
dentalclinic.security.refresh-cookie.secure=true
dentalclinic.security.refresh-cookie.same-site=Lax
dentalclinic.security.refresh-cookie.path=/api/auth
# CORS con origenes explicitos (Architecture.md 7.9): nunca '*' en produccion.
dentalclinic.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}