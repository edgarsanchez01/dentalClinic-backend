# Perfil DEV (Architecture.md 5.6, 12). SOLO VALORES TECNICOS DE DESARROLLO:
# ninguno de estos numeros constituye una decision de producto ni se aplica en
# produccion. La clave de firma es un literal de desarrollo, no un secreto.
#
# El dev lanza el backend contra PostgreSQL local (valores por defecto del
# archivo base) y el frontend Vite en http://localhost:5173 (CORS explicito).

dentalclinic.security.jwt.secret=${JWT_SECRET:dev-only-hs256-secret-0123456789abcdef00}
dentalclinic.security.jwt.issuer=dentalclinic-dev

# Caducidades tecnicas: 72 h para invitacion/activacion y 24 h para recuperacion.
# No son normativas (RF-IA-09 y RF-IA-12 no fijan valor de producto) y no son
# un default reutilizable en produccion.
dentalclinic.security.invitation.ttl=72h
dentalclinic.security.password-reset.ttl=24h

# Dev corre en HTTP sin TLS: una cookie Secure seria descartada por el navegador.
# En produccion el archivo base fija secure=true, sin override posible por perfil.
dentalclinic.security.refresh-cookie.secure=false

dentalclinic.security.cors.allowed-origins=http://localhost:5173