# Perfil de produccion.
#
# Reglas duras aplicadas aqui (Architecture.md 12.3, 12.4, 19.2):
#   - ddl-auto = none. La aplicacion NO altera el esquema.
#   - Sin secretos en el repo: todas las credenciales son obligatorias y llegan
#     por variable de entorno. Si falta una, el arranque falla (fail fast).
#   - Sin fixtures. La barrera decisiva es el @Profile de FixturesGuard: aunque
#     alguien exporte FIXTURES_ENABLED=true, el componente no se instancia bajo
#     este perfil. La bandera y la verificacion de base son barreras adicionales.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

# none = la app no toca el esquema. validate queda disponible como red de
# seguridad en un entorno previo a produccion (Architecture.md 12.3):
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=none

server.shutdown=graceful
server.forward-headers-strategy=framework

management.endpoint.health.show-details=never
management.health.db.enabled=true

dentalclinic.fixtures.enabled=false
dentalclinic.fixtures.require-empty-database=true