# Perfil de testing.
#
# La URL y las credenciales las inyecta Testcontainers en tiempo de ejecucion
# (Architecture.md 12.2: esquema limpio por test). Este archivo solo fija el
# comportamiento, nunca un servidor real.

spring.jpa.hibernate.ddl-auto=create-drop
spring.main.banner-mode=off

management.endpoint.health.show-details=always

# En tests no hay ninguna siembra automatica: los datos los crea cada test.
dentalclinic.fixtures.enabled=false
dentalclinic.fixtures.require-empty-database=true
dentalclinic.fixtures.allowed-profiles=dev,demo
dentalclinic.fixtures.forbidden-databases=dental,postgres,production,prod