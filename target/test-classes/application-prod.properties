# Perfil PROD SOLO PARA TESTS DE INTEGRACION (ProductionRuntimeCreatesNoDataTest).
#
# Este archivo SOLO existe en src/test/resources: nunca se empaqueta en el
# artefacto de produccion, y es lo que permite levantar el contexto con perfil
# `prod` en un contenedor efimero. Reproduce, con valores tecnicos, lo que un
# operador de produccion provee por entorno: ddl-auto=none y cero datos (se
# verifica precisamente en ese test).
#
# IMPORTANTE: esto NO relaja las barreras de produccion. El test comprueba que
# `spring.jpa.hibernate.ddl-auto` es `none`, que fixtures siguen desactivadas y
# que el arranque no crea tablas de negocio.

spring.jpa.hibernate.ddl-auto=none

dentalclinic.fixtures.enabled=false
dentalclinic.fixtures.require-empty-database=true
dentalclinic.fixtures.expected-database=dentalclinic_prod_it

dentalclinic.security.jwt.secret=prod-it-only-hs256-secret-0123456789abcdef56
dentalclinic.security.jwt.issuer=dentalclinic-prod-it
dentalclinic.security.jwt.access-token-ttl=15m
dentalclinic.security.refresh.ttl=30d
dentalclinic.security.invitation.ttl=1d
dentalclinic.security.password-reset.ttl=1h
dentalclinic.security.refresh-cookie.name=dentalclinic_refresh
dentalclinic.security.refresh-cookie.secure=true
dentalclinic.security.refresh-cookie.same-site=Lax
dentalclinic.security.refresh-cookie.path=/api/auth
dentalclinic.security.cors.allowed-origins=https://clinic.example.test