spring.datasource.url=jdbc:tc:postgresql:16:///dentalclinic_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=dentalclinic
spring.datasource.password=dentalclinic
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.main.banner-mode=off

dentalclinic.fixtures.enabled=false
dentalclinic.fixtures.require-empty-database=true
dentalclinic.fixtures.expected-database=dentalclinic_test

# ===== Seguridad: valores TECNICOS exclusivos para tests =====
# No constituyen decision de producto (los TTL de un solo uso no tienen valor
# normativo; RF-IA-09 / RF-IA-12 solo exigen que expiren) ni son un default de
# produccion: el archivo base no define TTL procedente de entorno en prod.
dentalclinic.security.jwt.secret=test-only-hs256-secret-0123456789abcdef1234
dentalclinic.security.jwt.issuer=dentalclinic-test
dentalclinic.security.jwt.access-token-ttl=15m
dentalclinic.security.refresh.ttl=30d
dentalclinic.security.invitation.ttl=1d
dentalclinic.security.password-reset.ttl=1h
dentalclinic.security.refresh-cookie.name=dentalclinic_refresh
dentalclinic.security.refresh-cookie.secure=false
dentalclinic.security.refresh-cookie.same-site=Lax
dentalclinic.security.refresh-cookie.path=/api/auth
dentalclinic.security.cors.allowed-origins=http://localhost:5173